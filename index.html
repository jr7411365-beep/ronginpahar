<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>রঙিন পাহাড়</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9ecf4;--ink:#1b1d2a;--muted:#5d6278;--panel:#ffffff;--btn:#1b1d2a;--btnink:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141d;--ink:#eef0f8;--muted:#9aa0b8;--panel:#1c1f2c;--btn:#eef0f8;--btnink:#12141d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141d;--ink:#eef0f8;--muted:#9aa0b8;--panel:#1c1f2c;--btn:#eef0f8;--btnink:#12141d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.pill{background:var(--panel);border-radius:16px;padding:6px 14px;font-weight:700;font-size:1.05rem;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.pill small{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
#tank{width:min(46vw,220px)}
#tank .bar{height:14px;border-radius:99px;background:rgba(128,128,140,.3);overflow:hidden;margin-top:4px}
#tank i{display:block;height:100%;width:100%;border-radius:99px;background:hsl(0,70%,50%)}
#pedals{position:absolute;left:0;right:0;bottom:14px;padding:0 14px;display:flex;justify-content:space-between;pointer-events:none}
.pedal{pointer-events:auto;width:clamp(96px,28vw,150px);height:clamp(70px,18vw,96px);border-radius:22px;border:3px solid var(--btn);background:var(--panel);color:var(--ink);font:inherit;font-weight:700;font-size:1.2rem;opacity:.9;touch-action:none}
.pedal.on{background:var(--btn);color:var(--btnink)}
#ov,#shop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,22,32,.35)}
#ov[hidden],#shop[hidden]{display:none}
.card{background:var(--panel);border-radius:26px;padding:26px 26px 22px;max-width:380px;text-align:center}
.card h1{margin:0 0 8px;font-size:1.9rem}
.card p{margin:0 0 16px;color:var(--muted);line-height:1.5}
.card b{color:var(--ink)}
.go{font:inherit;font-weight:700;font-size:1.1rem;border:0;border-radius:99px;padding:12px 32px;background:var(--btn);color:var(--btnink);cursor:pointer}
#shop{background:rgba(20,22,32,.6)}
#mute{position:absolute;top:72px;right:12px;width:44px;height:44px;border-radius:50%;border:2px solid var(--btn);background:var(--panel);font-size:1.2rem;cursor:pointer;padding:0}
.card{max-height:100%;overflow:auto;touch-action:pan-y}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.go.alt{background:transparent;color:var(--ink);border:2px solid var(--btn)}
.card h2{font-size:1.1rem;margin:16px 0 2px;text-align:left}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:10px 0;border-bottom:1px solid rgba(128,128,140,.25)}
.it small{display:block;color:var(--muted);font-weight:500}
.it button{font:inherit;font-weight:700;border:2px solid var(--btn);background:transparent;color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.it button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid #6b7cff;outline-offset:2px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="pill" id="tank"><small>রঙের ট্যাংক</small><div class="bar"><i id="fuel"></i></div></div>
    <div class="pill"><small>দূরত্ব</small><span id="dist">০</span> মি</div>
  </div>
  <div id="pedals">
    <button class="pedal" id="bBrake" aria-label="ব্রেক">ব্রেক</button>
    <button class="pedal" id="bGas" aria-label="গ্যাস">গ্যাস</button>
  </div>
  <div id="ov">
    <div class="card">
      <h1 id="ovT">রঙিন পাহাড়</h1>
      <p id="ovP">পৃথিবীটা ধূসর। গাড়ি চালিয়ে রং ছড়িয়ে দাও। রঙের ক্যান কুড়িয়ে ট্যাংক ভরো, নাহলে রং ফুরোবে।<br><b>গ্যাস ▶ / ব্রেক ◀</b> (কিবোর্ডে তীর চিহ্ন)। বাতাসে থাকলে গাড়ি ঘোরানো যায়।</p>
      <div class="row"><button class="go" id="go">শুরু করো</button><button class="go alt" id="shopBtn">গ্যারেজ</button></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const bn=n=>Number(n).toLocaleString("bn-BD",{useGrouping:false});
const cv=$("cv"),ctx=cv.getContext("2d");
let W=0,H=0;
function resize(){
  const r=cv.parentElement.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);
  W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener("resize",resize);resize();

/* ---- terrain ---- */
function gnd(x,MAP){
  const f=Math.min(1,Math.max(0,(x-250)/700));
  const A=(45+Math.min(70,x/90))*f*(MAP===2?.7:1);
  if(MAP>=4){const m=((x%1300)+1300)%1300,rp=m>900&&m<1000?(m-900)*.45:m>=1000&&m<1060?45-(m-1000)*.75:0;return -A*.3*(Math.sin(x*.003)+.4*Math.sin(x*.008+1))-rp*f}
  if(MAP===3)return -A*1.15*(Math.sin(x*.0025)+.5*Math.sin(x*.006+1)+.6*Math.sin(x*.0014+3));
  return -A*(Math.sin(x*.0035)+.35*Math.sin(x*.009+1.3)+.9*Math.sin(x*.0021+2))+(MAP===1?f*(5*Math.sin(x*.045)+3*Math.sin(x*.11+1)):0);
}
const slope=x=>(ground(x+2)-ground(x-2))/4;
const hue=x=>(x*.09)%360;

/* ---- physics constants ---- */
const GRAV=900,K=1500,C=40,I=1600,VMAX=600,AIR=8000;
let R=14,DRIVE=380,FMUL=1,CAP=100,ROLL=.4,MAP=0;
const WH=[[-34,18],[34,18]];
const ROOF=[[-20,-22],[0,-30],[16,-22]];

/* ---- state ---- */
let state="ready",car,fuel,cans,nextCan,parts,paintedX,camX,camY,stuck,best=0;
const input={gas:false,brake:false};
try{best=parseInt(localStorage.getItem("pahar-best")||"0",10)||0}catch(e){}

const CARS=[
 {n:"জিপ",p:0,R:14,dm:1,fm:1,d:"সবদিক থেকে ঠিকঠাক"},
 {n:"রিকশা",p:300,R:17,dm:.85,fm:.7,d:"রং কম খরচ হয়, ইঞ্জিনে জোর কম"},
 {n:"মনস্টার ট্রাক",p:600,R:22,dm:1.15,fm:1.25,d:"বড় চাকা, জোর বেশি, রং বেশি খরচ"}
];
let save={money:0,up:{engine:0,tank:0},own:[0],sel:0},colN=0;
try{const s=JSON.parse(localStorage.getItem("pahar-save")||"null");if(s&&s.up&&s.own)save=s}catch(e){}
const persist=()=>{try{localStorage.setItem("pahar-save",JSON.stringify(save))}catch(e){}};
const MAXUP=5,upCost=l=>100*(l+1);
function applyStats(){const c=CARS[save.sel]||CARS[0];R=c.R;DRIVE=380*c.dm*(1+.12*save.up.engine);CAP=100*(1+.2*save.up.tank);FMUL=c.fm;MAP=save.map||0;ROLL=MAP===1?.75:(MAP===3||MAP>=4)?.33:.4}
function reset(){applyStats();colN=0;stunt=0;flipN=0;wasAir=false;gT=0;toastT=0;CH=mkChal();refreshChal();enemies=[];shots=[];spawnT=7;fireT=0;plane.x=0;curSeg=-1;fadeT=0;
  const x0=120+(trip?trip.cpM*40:0);runX0=x0;car={x:x0,y:ground(x0)-40,vx:0,vy:0,a:0,w:0,wa:0};
  fuel=CAP;cans=[];nextCan=x0+900;parts=[];paintedX=x0-20;stuck=0;
  camX=car.x-W*.3;camY=car.y-H*.6;
}
function spawn(x,y,n,h,sp){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*sp;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.4,l:.8+Math.random()*.5,h:h+Math.random()*30-15});
  }
}

function step(h){
  const c=car,ca=Math.cos(c.a),sa=Math.sin(c.a),gas=input.gas&&fuel>0;
  let fx=0,fy=GRAV,tq=0,g=0;
  for(const wo of WH){
    const rx=wo[0]*ca-wo[1]*sa,ry=wo[0]*sa+wo[1]*ca;
    const wx=c.x+rx,wy=c.y+ry,pen=wy+R-ground(wx);
    if(pen<=0)continue;
    g++;
    const s=slope(wx),nl=Math.hypot(s,1),nx=s/nl,ny=-1/nl,tx=1/nl,ty=s/nl;
    const vx=c.vx-c.w*ry,vy=c.vy+c.w*rx;
    const vn=vx*nx+vy*ny,vt=vx*tx+vy*ty;
    let Fn=Math.min(6000,Math.max(0,K*pen-C*vn));
    if(vn<-320&&Math.random()<.5)spawn(wx,wy+R,3,hue(wx),160);
    if(vn<-320&&performance.now()-lastLand>150){lastLand=performance.now();sfx.land(-vn)}
    const wet=MAP===2&&wy>WATER;
    if(wet&&Math.abs(vn)+Math.abs(vt)>120&&Math.random()<.15)spawn(wx,wy,2,200,120);
    let Ft=-ROLL*(wet?3.2:1)*vt;
    if(gas)Ft+=DRIVE*Math.max(0,1-vt/VMAX);
    if(input.brake)Ft-=DRIVE*.6*Math.max(0,1+Math.min(vt,0)/260);
    const Fx=Fn*nx+Ft*tx,Fy=Fn*ny+Ft*ty;
    fx+=Fx;fy+=Fy;
    tq+=rx*(Fn*ny+Ft*ty)-ry*(Fn*nx+Ft*tx*.3);
  }
  if(!g){
    if(gas)tq-=AIR;
    if(input.brake)tq+=AIR;
  }
  c.vx+=fx*h;c.vy+=fy*h;c.w+=tq/I*h;c.w-=c.w*.5*h;
  c.x+=c.vx*h;c.y+=c.vy*h;c.a+=c.w*h;
  step.g=g;
}

function crashed(){
  const ca=Math.cos(car.a),sa=Math.sin(car.a);
  for(const p of ROOF){
    const rx=p[0]*ca-p[1]*sa,ry=p[0]*sa+p[1]*ca;
    if(car.y+ry>ground(car.x+rx)-1)return true;
  }
  return false;
}

function finish(why){
  state="over";if(why==="tank")sfx.click();else sfx.crash();engineSound(0,false);refreshChal();
  const d=Math.max(0,Math.floor((car.x-runX0)/40));const earn=Math.round((d+colN*10+stunt)*(MAPS[MAP]?MAPS[MAP].m:1));save.money+=earn;persist();
  if(d>best){best=d;try{localStorage.setItem("pahar-best",String(best))}catch(e){}}
  $("ovT").textContent=why==="tank"?"রং ফুরিয়ে গেছে":"গাড়ি উল্টে গেছে";
  $("ovP").innerHTML=`তুমি <b>${bn(d)} মিটার</b> রঙিন করেছ।<br>সেরা: <b>${bn(best)} মিটার</b><br>আয়: <b>${bn(earn)} কয়েন</b> (মোট ${bn(save.money)})`;
  $("go").textContent="আবার চালাও";
  if(why==="hit")$("ovT").textContent="শত্রুর গাড়ির সাথে সংঘর্ষ!";tripFail(why);showNewAch();$("ov").hidden=false;
}

function begin(){reset();state="play";$("ov").hidden=true;$("newTrip").style.display="none";$("shareBtn").style.display="none";$("certBtn").style.display="none";audioInit()}
$("go").onclick=()=>{if(trip&&!trip.done&&state==="over")begin();else openTrip()};

/* ---- update ---- */
const HS=1/240;let acc=0,last=performance.now(),tick=0;
function update(dt){
  acc+=dt;let n=0;
  while(acc>=HS&&n<8){step(HS);acc-=HS;n++}
  MAP=mapAt(car.x);ROLL=MAP===1?.75:(MAP===3||MAP>=4)?.33:.4;
  const spd=Math.hypot(car.vx,car.vy);engineSound(spd,input.gas&&fuel>0);
  car.wa+=(car.vx*Math.cos(car.a)+car.vy*Math.sin(car.a))/R*dt;
  fuel-=dt*FMUL*((input.gas&&fuel>0)?7:2.5);
  if(fuel<=0){fuel=0;stuck=spd<12?stuck+dt:0;if(stuck>1.6)return finish("tank")}
  if(input.gas&&fuel>0&&step.g&&(tick++%3===0))spawn(car.x-36,car.y+20,1,hue(car.x),70);
  paintedX=Math.max(paintedX,car.x+30);
  while(nextCan<car.x+2200){cans.push({x:nextCan,t:false});nextCan+=700+Math.random()*400+Math.min(500,nextCan/40)}
  for(const c of cans){
    if(!c.t&&Math.abs(c.x-car.x)<48&&Math.abs(ground(c.x)-20-car.y)<70){
      c.t=true;colN++;sfx.can();save.cans=(save.cans||0)+1;fuel=Math.min(CAP,fuel+40);spawn(c.x,ground(c.x)-20,18,hue(c.x),260);
    }
  }
  cans=cans.filter(c=>c.x>car.x-600);
  for(const p of parts){p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}
  parts=parts.filter(p=>p.l>0);
  if(crashed())finish("crash");else{stunts(dt);chalCheck();if(toastT>0)toastT-=dt;combat(dt);if(state==="play")journey(dt);achTick()}
}

/* ---- render ---- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function render(){MAP=mapAt(car.x);
  const tx=car.x-W*.3,ty=car.y-H*.6;
  camX+=(tx-camX)*.15;camY+=(ty-camY)*.08;
  const sat=8+Math.min(62,(paintedX-100)/60);
  const sky=ctx.createLinearGradient(0,0,0,H);
  const SK=[[205,68,205,90],[205,42,205,66],[165,52,70,84],[212,56,210,88],[255,30,320,58],[212,60,28,84]][MAP]||[205,68,205,90];
  sky.addColorStop(0,`hsl(${SK[0]},${sat}%,${SK[1]}%)`);sky.addColorStop(1,`hsl(${SK[2]},${sat*.6}%,${SK[3]}%)`);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);clouds(0,performance.now()/1000);
  ctx.fillStyle=MAP>=4?"hsl(250,20%,"+(MAP===4?18:55)+"%)":MAP===3?`hsl(130,${20+sat*.5}%,48%)`:`hsl(215,${sat*.5}%,80%)`;ctx.beginPath();ctx.moveTo(0,H);
  for(let sx=0;sx<=W+10;sx+=10){ctx.lineTo(sx,H*.55-camY*.15+Math.sin((camX*.25+sx)*.004)*40+Math.sin((camX*.25+sx)*.011)*14)}
  ctx.lineTo(W+10,H);ctx.fill();

  if(MAP===2){
    ctx.fillStyle="hsl(125,32%,20%)";
    for(let i=0;i<14;i++){const px=(((i*140-camX*.5)%(W+160))+(W+160))%(W+160)-80,py=H*.62-camY*.15+Math.sin(i*2.1)*20;ctx.fillRect(px-3,py,6,60);ctx.beginPath();ctx.arc(px,py,26+(i%3)*6,0,7);ctx.fill()}
    const wy=WATER-camY;ctx.fillStyle="hsl(180,42%,34%)";ctx.beginPath();ctx.moveTo(0,H);
    for(let sx=0;sx<=W+8;sx+=8)ctx.lineTo(sx,wy+Math.sin((camX+sx)*.05+performance.now()/300)*2);
    ctx.lineTo(W+8,H);ctx.fill();
  }
  if(MAP===3){
    ctx.fillStyle="hsl(128,38%,32%)";ctx.beginPath();ctx.moveTo(0,H);
    for(let sx=0;sx<=W+10;sx+=10)ctx.lineTo(sx,H*.66-camY*.25+Math.sin((camX*.4+sx)*.006)*55+Math.sin((camX*.4+sx)*.017)*12);
    ctx.lineTo(W+10,H);ctx.fill();
    ctx.strokeStyle="rgba(235,235,235,.8)";ctx.lineWidth=3;ctx.beginPath();
    for(let sx=0;sx<=W+10;sx+=10){const w2=camX*.4+sx,y=H*.66-camY*.25+Math.sin(w2*.006)*55+Math.sin(w2*.017)*12+14+Math.sin(w2*.05)*6;if(sx)ctx.lineTo(sx,y);else ctx.moveTo(sx,y)}
    ctx.stroke();
    clouds(1,performance.now()/1000);
  }
  if(MAP>=4)city(performance.now()/1000);
  const st=6;
  for(let wx=Math.floor(camX/st)*st;wx<camX+W+st;wx+=st){
    MAP=mapAt(wx);
    const sx=wx-camX,y1=ground(wx)-camY,y2=ground(wx+st)-camY,p=wx+st<=paintedX;
    ctx.fillStyle=p?`hsl(${MAP===3?95+hue(wx)%50:hue(wx)},62%,${MAP?44:52}%)`:(MAP===2?"hsl(110,14%,26%)":MAP===3?"hsl(120,8%,34%)":MAP>=4?"hsl(220,8%,40%)":MAP?"hsl(28,20%,30%)":"hsl(220,6%,50%)");
    ctx.beginPath();ctx.moveTo(sx,y1);ctx.lineTo(sx+st,y2);ctx.lineTo(sx+st+.5,H+10);ctx.lineTo(sx,H+10);ctx.fill();
    ctx.strokeStyle=p?`hsl(${hue(wx)},72%,34%)`:(MAP===2?"hsl(110,18%,14%)":MAP?"hsl(28,22%,18%)":"hsl(220,6%,30%)");if(MAP>=3)ctx.strokeStyle="hsl(220,8%,24%)";ctx.lineCap=MAP>=3?"round":"butt";ctx.lineWidth=MAP>=3?8:5;
    ctx.beginPath();ctx.moveTo(sx,y1);ctx.lineTo(sx+st+1,y2);ctx.stroke();
  }

  MAP=mapAt(car.x);
  if(MAP>=3){ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=2;ctx.beginPath();for(let wx=Math.floor(camX/48)*48;wx<camX+W+48;wx+=48){ctx.moveTo(wx-camX,ground(wx)-camY);ctx.lineTo(wx+24-camX,ground(wx+24)-camY)}ctx.stroke()}
  const now=performance.now()/1000;
  for(const c of cans){
    if(c.t||c.x<camX-40||c.x>camX+W+40)continue;
    const x=c.x-camX,y=ground(c.x)-camY-26+Math.sin(now*3+c.x)*3;
    ctx.fillStyle="#f4f4f6";rr(x-10,y-4,20,28,4);ctx.fill();
    ctx.fillStyle=`hsl(${hue(c.x)},85%,50%)`;ctx.fillRect(x-10,y+5,20,12);
    ctx.fillStyle="#999";ctx.fillRect(x-6,y-9,12,6);
  }

  for(const p of parts){
    ctx.globalAlpha=Math.min(1,p.l*2);ctx.fillStyle=`hsl(${p.h},85%,52%)`;
    ctx.beginPath();ctx.arc(p.x-camX,p.y-camY,4,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.save();ctx.translate(car.x-camX,car.y-camY);ctx.rotate(car.a);
  for(const wo of WH){
    ctx.save();ctx.translate(wo[0],wo[1]);ctx.rotate(car.wa);
    ctx.fillStyle="#222";ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
    ctx.fillStyle="#d8d8de";ctx.beginPath();ctx.arc(0,0,R*.5,0,7);ctx.fill();
    ctx.strokeStyle="#777";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-R*.5,0);ctx.lineTo(R*.5,0);ctx.stroke();
    ctx.restore();
  }
  const col=`hsl(${hue(car.x)},80%,50%)`;
  drawBody(col);
  ctx.restore();

  if(MAP===1){ctx.strokeStyle="rgba(200,215,235,.55)";ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<70;i++){const sx=(((i*173-now*120)%(W+80))+(W+80))%(W+80)-40,sy=((i*97+now*700+i*i)%(H+40))-20;ctx.moveTo(sx,sy);ctx.lineTo(sx-6,sy+16)}ctx.stroke()}
  if(toastT>0){ctx.save();ctx.globalAlpha=Math.min(1,toastT);ctx.font="700 26px 'Hind Siliguri',sans-serif";ctx.textAlign="center";ctx.lineWidth=5;ctx.strokeStyle="rgba(0,0,0,.55)";ctx.strokeText(toastTxt,W/2,H*.3);ctx.fillStyle="#fff";ctx.fillText(toastTxt,W/2,H*.3);ctx.restore()}
  drawCombat(now);
  if(MAP>=4)cityFx(now);
  drawFade();
  $("fuel").style.width=fuel/CAP*100+"%";
  $("fuel").style.background=`hsl(${hue(car.x)},75%,50%)`;
  $("dist").textContent=bn(Math.max(0,Math.floor((car.x-120)/40)));
}

function frame(t){

  g.save();g.translate(1205,800);g.rotate(-.25);g.strokeStyle=col;g.lineWidth=8;rrg(g,-110,-55,220,110,18);g.stroke();g.fillStyle=col;g.font=`700 84px ${F}`;g.fillText(pass?"পাস":"ফেল",0,28);g.restore();

$("wrap").insertAdjacentHTML("beforeend",`<div id="shop" hidden><div class="card" style="width:min(420px,100%)"><h1>গ্যারেজ</h1><p>তোমার কয়েন: <b id="money">০</b><br>প্রতি মিটারে ১ কয়েন, প্রতিটা ক্যানে ১০ কয়েন।</p><div id="shopBody"></div><button class="go" id="shopX" style="margin-top:16px">ফিরে যাও</button></div></div>`);
function renderShop(){
  const rows=[["engine","ইঞ্জিন","গাড়ি আরও জোরে ওঠে"],["tank","রঙের ট্যাংক","একবারে বেশি রং ধরে"]].map(([k,n,d])=>{
    const l=save.up[k],mx=l>=MAXUP;
    return `<div class="it"><div><b>${n}</b> <small>লেভেল ${bn(l)}/${bn(MAXUP)}, ${d}</small></div><button data-up="${k}" ${mx||save.money<upCost(l)?"disabled":""}>${mx?"পূর্ণ":bn(upCost(l))+" কয়েন"}</button></div>`}).join("");
  const cars=CARS.map((c,i)=>{
    const own=save.own.includes(i),sel=save.sel===i;
    return `<div class="it"><div><b>${c.n}</b><small>${c.d}</small></div><button data-car="${i}" ${sel||(!own&&save.money<c.p)?"disabled":""}>${sel?"চালাচ্ছ":own?"বেছে নাও":bn(c.p)+" কয়েন"}</button></div>`}).join("");
  const maps=MAPS.map((m,i)=>{const own=save.maps.includes(i),sel=save.map===i;return `<div class="it"><div><b>${m.n}</b><small>${m.d}</small></div><button data-map="${i}" ${sel||(!own&&save.money<m.p)?"disabled":""}>${sel?"খেলছ":own?"বেছে নাও":bn(m.p)+" কয়েন"}</button></div>`}).join("");
  $("shopBody").innerHTML=`<h2>আপগ্রেড</h2>${rows}<h2>ম্যাপ</h2>${maps}<h2>গাড়ি</h2>${cars}`;
  $("money").textContent=bn(save.money);
}
$("shopBody").onclick=e=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;
  if(b.dataset.up){const k=b.dataset.up,l=save.up[k];if(l<MAXUP&&save.money>=upCost(l)){save.money-=upCost(l);save.up[k]++}}
  else if(b.dataset.map!==undefined){const i=+b.dataset.map;if(save.maps.includes(i))save.map=i;else if(save.money>=MAPS[i].p){save.money-=MAPS[i].p;save.maps.push(i);save.map=i}}
  else if(b.dataset.car!==undefined){const i=+b.dataset.car;if(save.own.includes(i))save.sel=i;else if(save.money>=CARS[i].p){save.money-=CARS[i].p;save.own.push(i);save.sel=i}}
  sfx.click();persist();renderShop();reset();
};

/* ---- input ---- */
function hold(el,key){
  const on=e=>{e.preventDefault();input[key]=true;el.classList.add("on")};
  const off=()=>{input[key]=false;el.classList.remove("on")};
  el.addEventListener("pointerdown",on);
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,off));
  el.addEventListener("contextmenu",e=>e.preventDefault());
}
hold($("bGas"),"gas");hold($("bBrake"),"brake");
const KG=["ArrowRight","ArrowUp","d","D","w","W"],KB=["ArrowLeft","ArrowDown","a","A","s","S"];
addEventListener("keydown",e=>{
  if(KG.includes(e.key)){input.gas=true;$("bGas").classList.add("on");e.preventDefault()}
  if(KB.includes(e.key)){input.brake=true;$("bBrake").classList.add("on");e.preventDefault()}
});
addEventListener("keyup",e=>{
  if(KG.includes(e.key)){input.gas=false;$("bGas").classList.remove("on")}
  if(KB.includes(e.key)){input.brake=false;$("bBrake").classList.remove("on")}
});
</script>
